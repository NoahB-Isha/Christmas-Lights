[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightshow"
version = "0.1.0"
description = "Author LED shows for SD-card pixel controllers (RGB01001 format)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pillow>=10.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
studio = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning"]
