    from: 0:00.41
    to: 1:23.13
    tempo_hint: "166.7 detected"
    palette: {"snowflakes": "frost", "stars": "white-gold", "workshop": "frost", "yule": "frost"}
    sections:
      - at: 0:00.41
        look: starfield
        intensity: 2
        note: "Chorus of the bells- start of music, piccato violin plucks, sounds like a scattered starfield"
      - at: 0:17.48
        look: pulse
        intensity: 3
        note: "beat comes in, as well as a melody"
      - at: 0:26.04
        look: build
        intensity: 7
        note: "beat builds up, violin comes in"
