# show.yaml -- the music show, authored in seconds. See docs/09-SHOW-DESIGN.md §5.
# Times and notes come from assets/show/markers.json (the owner's listening notes).
# `look` names are defined under `looks:`; edit freely -- the renderer reads this file.
# intensity: 0-10 (null = let the analysis decide). Each song has a THEME and a theme palette;
# a group may override with `palette: {snowflakes: frost, ...}` if a theme wants per-group colour.

audio: assets/audio/show16.mp3
fps: 60
layout: assets/layout.json
markers: assets/show/markers.json
songs_analysis: out/songs.json   # per-song beat grids (make songs)

defaults:
  transition_s: 1.5
  shimmer: true        # always-on low-density twinkle under everything
  # BRIGHTNESS GUIDELINE (owner, 2026-09-07): avoid total blackouts. Darkness
  # is for contrast or for looks that need it (starfield); otherwise lights are
  # ON. The 75% is a share of TIME within a song, not of area, and it is a
  # soft target that a particular effect may stretch. The renderer reports
  # the figure per song for information -- it never clamps or enforces.
  brightness:
    floor: 0.10              # per-prop mean never below this outside dark looks
    target_level: 0.60       # "60% brightness or higher" (perceptual, pre-gamma)
    target_fraction: 0.75    # "...at least 75% of the time" (measured per song)
    dark_ok_looks: [starfield, hold-breath, fade]   # exempt from the target
    max_ok: true             # more time at full is welcome

palettes:
  # -- theme palettes (one per song, owner's list) --
  ice-storm:   {hues: [0.52, 0.58, 0.64], white_core: true, sat_max: 0.9, notes: 'cool white to deep blue, turbulent'}
  ice-plum:    {hues: [0.58, 0.78, 0.86, 0.52], white_core: true, sat_max: 0.95, notes: 'the ice storm with purple breaking through -- for drops'}
  classic:     {hues: [0.00, 0.33, 0.12], notes: 'red, green (needs hardware tuning), gold'}
  plum-storm:  {hues: [0.78, 0.85, 0.70], white_core: true, sat_max: 1.0, sparkle_hue: 0.92,
                flash: {hue: 0.88, sat: 0.45, level: 0.75},
                notes: 'plum/magenta/violet; PINK sparkle grains; lightning is a light pink-purple unless a section asks for white'}
  jewels:      {hues: [0.12, 0.10, 0.14], accents: {emerald: 0.38, ruby: 0.99, diamond: null}, accent_density: 0.07, sat_max: 0.9,
                flash: {hue: 0.12, sat: 0.35, level: 0.8},
                notes: 'predominantly gold; scattered emerald, ruby, white-diamond pixels; lightning is warm gold-white'}
  modern:      {hues: [0.00, 0.98], stripes: {colors: [white, red], width_in: 8}, notes: 'candy stripes, clean modern red/white with cool accents'}
  tacky:       {hues: [0.00, 0.17, 0.33, 0.50, 0.67, 0.83], sat_max: 1.0, notes: 'every colour, fast changes, multicolour bulbs -- deliberately over the top'}
  romantic:    {hues: [0.98, 0.92, 0.55], white_core: false, notes: 'reds and pinks; icy blue that melts away top-to-bottom to reveal warm'}
  ai-choice:   {hues: [], notes: 'AI decides; propose before rendering'}
  pale:        {hues: [0.10, 0.55, 0.85], sat_max: 0.25, notes: 'pastel/pale; expression is BRIGHTNESS driven by musical elements, not hue'}
  # -- component palettes --
  frost:       {hues: [0.52, 0.60, 0.68], white_core: true}
  white-gold:  {hues: [0.11, 0.13], white_core: true, sat_max: 0.6}
  gold:        {hues: [0.10, 0.12, 0.14], sat_max: 0.9}
  classic:     {hues: [0.00, 0.33, 0.12], notes: 'red, green (needs hardware tuning), gold'}
  violet-ice:  {hues: [0.70, 0.78, 0.55], white_core: true}
  fiesta:      {hues: [0.00, 0.08, 0.15, 0.33], sat_max: 1.0}
  white:       {hues: [0.60], sat_max: 0.15}

looks:
  starfield: "mostly dark; single bulbs pop on onsets and cool out (frost); a few whole props twinkle in/out"
  pulse: "whole-prop breathing on the beat, group colour, low amplitude"
  build: "brightness and sparkle density ramp toward the next marker"
  hold-breath: "everything drops to a dim ember; one feature prop holds; ends on the next marker"
  drop: "everything: full palette, course-wide wave on downbeats, sparkle on hits, arm/ray chases"
  wave: "slow colour waves travelling along the course, per-group hue, bass sets the width"
  conversation: "call and response between two sub-groups, phrase-locked to bars"
  feature: "one prop (or one group) carries the melody; others dim to a floor and ripple when it hits"
  chase: "wire-order chases and radial rings on the beat, mid-bright"
  ornaments: "steady group wash with pixel-cluster ornaments twinkling gold/red/blue"
  shimmer: "always-on low-density twinkle, no beat; used for intros, tails and fades"
  fade: "current look decays to embers over the section"
  change-up: "keep the family, re-roll variation seed, rotate palette"
  jewels: "CALM: each prop is a gemstone (mostly gold, a rotating few emerald/ruby/diamond); smooth waves; only glints follow the music"
  drawn: "the prop as painted -- each REGION (assets/paint) in its own colour, breathing; white sparkle"
  parts: "regions take turns on the pulse, top to bottom (hat, face, coat, belt, boots), each in its painted colour"
  finale: "song ending, big: full stack, white pops on the pulse, gusts both ways, unison stutter in the last two bars"

